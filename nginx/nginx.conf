worker_processes auto;

events {
    worker_connections 1024;  # 최대 동시 연결 수
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    server_tokens off;

    # 앞단 호스트 nginx가 프록시하므로 실제 클라이언트 IP 복원
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 앞단에서 TLS를 종료하므로 원본 스킴을 PHP 에 알려준다.
    # 이게 없으면 Laravel 의 request->isSecure() 가 false 가 되어
    # 세션에 저장되는 previous URL 과 일부 리다이렉트가 http 로 나간다.
    map $http_x_forwarded_proto $fastcgi_https {
        https on;
        default '';
    }

    # 자산 캐시 정책: mix 의 ?id= 나 ?v= 처럼 버전 쿼리가 붙은 요청만 장기 캐시한다.
    # 쿼리 없는 파일은 이름이 그대로라 30일 캐시를 주면 배포가 30일간 반영되지 않는다.
    map $args $asset_cache {
        ""      "max-age=0, must-revalidate";
        default "public, max-age=2592000";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    server {
        listen 20080 default_server;
        server_name dental.styleworks.kr;

        root /var/www/html/public;  # Laravel public 디렉토리 경로
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # css/js: 버전 쿼리가 있으면 30일, 없으면 매 요청 검증(ETag 로 304 처리)
        location ~* \.(css|js)$ {
            add_header Cache-Control $asset_cache;
            access_log off;
            try_files $uri =404;
        }

        # 이미지·폰트: 파일명이 바뀌는 방식이므로 장기 캐시
        location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot|otf)$ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass app:20009;  # PHP-FPM 컨테이너 이름과 포트
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTPS $fastcgi_https if_not_empty;   # https 요청임을 PHP 에 전달
            fastcgi_read_timeout 300;
        }

        # php-fpm 상태 페이지는 외부로 노출하지 않는다
        location = /__fpm_status {
            deny all;
        }

        # .env 등 숨김 파일 노출 차단 (.well-known 은 허용)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
