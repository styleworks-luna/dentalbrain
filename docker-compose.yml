services:
  app:
    build:
      context: .
      dockerfile: Dockerfile  # Dockerfile 경로
    image: dental_app:latest
    platform: linux/amd64
    container_name: dental_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      TZ: Asia/Seoul
    expose:
      - "20009"               # 내부 전용 (호스트 노출 없음)
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro           # .env 복사본 (APP_URL/세션 쿠키만 조정)
      - ./php-config/php.ini:/usr/local/etc/php/php.ini:ro
    # 호스트를 다른 서비스와 공유하므로 상한을 둔다 (호스트 16core / 31GB)
    mem_limit: 3g
    cpus: 4.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - dental

  web:
    image: nginx:alpine
    platform: linux/amd64
    container_name: dental_web
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:20080:20080"   # 호스트 nginx(80/443)가 이 포트로 프록시
    volumes:
      - .:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - app
    networks:
      - dental

# DB는 외부(NCP MySQL, .env 참조)를 사용하므로 컨테이너를 두지 않음
# 스케줄러(email:before / email:after)는 의도적으로 두지 않음 —
# 기존 운영 서버(dentalbrain.co.kr)가 같은 DB로 배치를 수행하므로 이중 발송 방지

networks:
  dental:
    driver: bridge
